name: Deploy Jekyll site tnt to Pages

on:
  push:
    branches: 
      - "master"
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: docs
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
      
      # 添加验证步骤，检查是否正确安装了 gems
      - name: Verify bundle installation
        run: |
          bundle check || bundle install
          bundle exec jekyll --version
      
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      
      - name: Verify _site contents
        run: |
          ls -la _site/
          if [ -f _site/CNAME ]; then
            echo "CNAME file found in build output"
            cat _site/CNAME
          else
            echo "CNAME file NOT found in build output"
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_site/
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4